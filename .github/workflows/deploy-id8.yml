name: Deploy ID-8

# ─────────────────────────────────────────────────────────────────────────────
# Single canonical Static Web App for ID-8.
#   • Target SWA :  id8-app (hostname resolved from Azure after provisioning)
#   • Resource gp:  rg-tsetati
#   • Deploy token: secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ID8
#
# Only id8-app is deployed by this workflow.
# The API is managed by Static Web Apps; do not deploy a separate Function App.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend and managed API
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:handoff
          npm --prefix api ci
          npm --prefix api run typecheck:scripts
          npm --prefix api test
          npm --prefix api run build
          npm --prefix api prune --omit=dev --ignore-scripts --no-audit
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ID8 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Managed Functions: build & deploy api/ as the SWA's API (Free-tier compatible)
          skip_api_build: true # API was compiled and production dependencies prepared above
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
      - name: Verify the production ID-8 identity and API
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ID8_APP_URL: ${{ vars.ID8_APP_URL }}
        run: node scripts/check-id8-live.mjs

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ID8 }}
          action: "close"
          app_location: "/" # App source code path
          api_location: "api" # Managed Functions: build & deploy api/ as the SWA's API (Free-tier compatible)
          output_location: "dist" # Built app content directory - optional
